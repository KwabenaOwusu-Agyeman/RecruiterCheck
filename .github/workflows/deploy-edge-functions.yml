# Deploys Supabase Edge Functions to production after a merge to main.
#
# Scope, deliberately narrow:
#   - runs only on a push to main that touches supabase/functions/**, the
#     function settings in supabase/config.toml, or this file
#   - deploys only the functions whose directories changed; a change under
#     supabase/functions/_shared/, to supabase/config.toml or to this file
#     deploys every function, since any of them may depend on it
#   - never runs a database migration (no supabase db push) and never
#     touches function secrets (no supabase secrets); both stay manual, see
#     CLAUDE.md
#   - fails closed: lint, typecheck and the Edge Function test suite must
#     pass first, and a failed deploy fails the run
#
# The frontend is not handled here. Vercel's GitHub integration already
# builds every push to main and promotes it to production.
#
# Secrets, set under Settings > Secrets and variables > Actions:
#   SUPABASE_ACCESS_TOKEN   a Supabase personal access token
#   SUPABASE_PROJECT_REF    the production project reference
# Both reach the CLI through the environment only. GitHub masks registered
# secret values in logs, and nothing below echoes them.

name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-edge-functions.yml'

permissions:
  contents: read

# One production deploy at a time. Queued, not cancelled: cancelling a run
# part way through could leave some functions on the new code and some on
# the old.
concurrency:
  group: supabase-edge-functions-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  SUPABASE_CLI_VERSION: '2.116.0'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      functions: ${{ steps.changed.outputs.functions }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff below needs the previous main commit as well.
          fetch-depth: 0

      - name: Work out which functions changed
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          all=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_shared' -printf '%f\n' | sort)

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No usable previous commit on main; deploying every function."
            selected="$all"
          else
            changed=$(git diff --name-only "$BEFORE" "$AFTER" -- supabase/functions supabase/config.toml .github/workflows/deploy-edge-functions.yml)
            if printf '%s\n' "$changed" | grep -qE '^(supabase/functions/_shared/|supabase/config\.toml$|\.github/workflows/deploy-edge-functions\.yml$)'; then
              echo "A shared dependency or configuration file changed; deploying every function."
              selected="$all"
            else
              # Only directories that still exist: a deleted function is not
              # deployed here, and removing it from the project stays manual.
              selected=$(printf '%s\n' "$changed" | sed -nE 's#^supabase/functions/([^/]+)/.*#\1#p' | sort -u | while read -r fn; do
                [ -n "$fn" ] && [ -d "supabase/functions/$fn" ] && echo "$fn" || true
              done)
            fi
          fi

          echo "Functions to deploy:"
          printf '%s\n' "$selected" | sed '/^$/d; s/^/  /'
          echo "functions=$(printf '%s\n' "$selected" | sed '/^$/d' | tr '\n' ' ' | sed 's/ *$//')" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Edge Function tests
        run: npm run test:edge

      - name: Scoring mutation check
        if: contains(steps.changed.outputs.functions, 'analyze-check')
        run: node scripts/mutation-check.mjs

  deploy:
    name: Deploy
    needs: validate
    if: needs.validate.outputs.functions != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Deploy changed functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          FUNCTIONS: ${{ needs.validate.outputs.functions }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must be set as repository secrets."
            exit 1
          fi
          # verify_jwt per function comes from supabase/config.toml, which the
          # CLI reads from the checkout. No project link is needed with
          # --project-ref, so nothing is written to the runner beyond the
          # bundle the CLI uploads.
          for fn in $FUNCTIONS; do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done
          echo "Deployed: $FUNCTIONS"
