project_id = "recruitercheck"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.external.google]
enabled = true

[auth.external.linkedin_oidc]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.analyze-check]
verify_jwt = true

[functions.create-checkout-session]
verify_jwt = true
